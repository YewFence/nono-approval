[package]
name = "rust-template"
version = "0.1.0"
description = "An opinionated Rust project template."
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

[dependencies]
blake3 = "1.8.5"
bytesize = { version = "2.4.2", features = ["serde"] }
clap = { version = "4.6.4", features = ["derive"] }
clap_complete = "4.6.8"
crossterm = { version = "0.29.0", default-features = false, features = ["events"] }
directories = "6.0.0"
getrandom = "0.4.3"
http-body-util = "0.1.4"
humantime = "2.4.0"
hyper = { version = "1.11.0", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
jiff = { version = "0.2.35", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
nix = { version = "0.31.3", default-features = false, features = ["socket", "user"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
shlex = "2.0.1"
tempfile = "3.27.0"
textwrap = "0.16.2"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "json"] }
unicode-width = "0.2.2"
vte = "0.15.0"
