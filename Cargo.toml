[package]
name = "rust-template"
version = "0.1.0"
description = "An opinionated Rust project template."
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
